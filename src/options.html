<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>video-tldr</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        max-width: 720px;
        margin: 0 auto;
      }
      /* The banner carries the name and the tagline, so this page does
         not repeat them — see docs/design-system.md. */
      .banner {
        display: block;
        width: 100%;
        max-width: 420px;
        height: auto;
        margin: 0 0 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .side-by-side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 var(--gap-l);
      }
      @media (max-width: 560px) {
        .side-by-side {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <img class="banner" src="img/banner.png" alt="video-tldr" />

    <div class="side-by-side">
      <div class="field">
        <label for="service-url" data-i18n="serviceUrl"></label>
        <input
          id="service-url"
          type="url"
          placeholder="http://127.0.0.1:8765"
        />
      </div>
      <div class="field">
        <label for="token" data-i18n="token"></label>
        <input
          id="token"
          type="password"
          autocomplete="off"
          data-i18n-placeholder="tokenPlaceholder"
        />
      </div>
    </div>
    <div class="row">
      <button id="connect" data-i18n="connect"></button>
      <button id="restart" type="button" data-i18n="restartService"></button>
      <span id="service-status" class="status" data-i18n="notConnected"></span>
    </div>
    <p class="help" data-i18n="restartServiceHelp"></p>

    <div id="no-service" class="box bad" hidden style="margin-top: 12px">
      <strong data-i18n="noService"></strong>
      <p class="help" data-i18n="noServiceHelp"></p>
      <div class="row" style="margin-top: 8px">
        <code id="start-command"></code>
        <button id="copy-command" data-i18n="copyCommand"></button>
      </div>
    </div>

    <ul class="lights" style="margin-top: 12px">
      <li id="light-service" class="light unknown"></li>
      <li id="light-llm" class="light unknown"></li>
      <li id="light-stt" class="light unknown"></li>
      <li id="light-capabilities" class="light unknown"></li>
    </ul>

    <fieldset id="service-settings">
      <hr />
      <div class="side-by-side">
        <div class="field">
          <label for="language" data-i18n="languageOfNote"></label>
          <select id="language"></select>
          <p class="help" data-i18n="languageHelp"></p>
        </div>
        <div class="field">
          <label for="style" data-i18n="style"></label>
          <select id="style"></select>
          <p class="help" data-i18n="styleHelp"></p>
        </div>
      </div>
      <div class="field">
        <label data-i18n="outputs"></label>
        <div id="formats" class="checks"></div>
      </div>
      <div class="field">
        <label for="download-dir" data-i18n="downloadDir"></label>
        <div class="row">
          <input id="download-dir" type="text" />
          <button id="pick-download" type="button" data-i18n="browse"></button>
        </div>
        <p class="help" data-i18n="downloadDirHelp"></p>
      </div>
      <div class="side-by-side">
        <div class="field">
          <label for="obsidian-vault" data-i18n="obsidianVault"></label>
          <div class="row">
            <input id="obsidian-vault" type="text" />
            <button id="pick-vault" type="button" data-i18n="browse"></button>
          </div>
        </div>
        <div class="field">
          <label for="obsidian-folder" data-i18n="obsidianFolder"></label>
          <input id="obsidian-folder" type="text" placeholder="Videos" />
        </div>
      </div>
      <div class="field">
        <label for="browser" data-i18n="browserForPdf"></label>
        <div class="row">
          <input id="browser" type="text" />
          <button id="pick-browser" type="button" data-i18n="browse"></button>
        </div>
        <p class="help" data-i18n="browserHelp"></p>
      </div>
      <div class="field">
        <label for="pdf-template" data-i18n="pdfTemplate"></label>
        <div class="row">
          <input id="pdf-template" type="text" />
          <button id="pick-template" type="button" data-i18n="browse"></button>
        </div>
        <p class="help" data-i18n="pdfTemplateHelp"></p>
      </div>

      <hr />
      <p class="help" data-i18n="modelHelp"></p>
      <div class="field" style="margin-top: 12px">
        <label for="llm" data-i18n="backend"></label>
        <select id="llm"></select>
        <p class="help" id="backend-info"></p>
      </div>
      <div class="field" data-field="anthropic_api_key">
        <label for="anthropic-api-key">Anthropic API key</label>
        <input id="anthropic-api-key" type="password" autocomplete="off" />
        <p class="help" data-i18n="keyNote"></p>
      </div>
      <div class="field" data-field="openai_api_key">
        <label for="openai-api-key">OpenAI API key</label>
        <input id="openai-api-key" type="password" autocomplete="off" />
        <p class="help" data-i18n="keyNote"></p>
      </div>
      <div class="field" data-field="openai_base_url">
        <label for="openai-base-url">OpenAI base URL</label>
        <input
          id="openai-base-url"
          type="text"
          placeholder="https://api.openai.com/v1"
        />
        <p class="help" data-i18n="openaiBaseUrlHelp"></p>
      </div>
      <div class="field" data-field="lmstudio_url">
        <label for="lmstudio-url">LM Studio URL</label>
        <input
          id="lmstudio-url"
          type="text"
          placeholder="http://localhost:1234/v1"
        />
      </div>
      <div class="field" data-field="ollama_url">
        <label for="ollama-url">Ollama URL</label>
        <input
          id="ollama-url"
          type="text"
          placeholder="http://localhost:11434/v1"
        />
      </div>
      <div class="field">
        <label for="model-choice" data-i18n="model"></label>
        <select id="model-choice"></select>
        <input id="model" type="text" hidden autocomplete="off" />
        <p class="help" id="model-hint"></p>
        <p class="help" data-i18n="modelAdvice"></p>
      </div>
      <div class="field">
        <div class="row">
          <button
            id="check-backend"
            type="button"
            data-i18n="checkModel"
          ></button>
          <span id="check-result" class="status"></span>
        </div>
        <p class="help" data-i18n="checkModelHelp"></p>
      </div>

      <hr />
      <div class="field">
        <label for="stt" data-i18n="transcriber"></label>
        <select id="stt"></select>
        <p class="help" data-i18n="sttHelp"></p>
      </div>
    </fieldset>

    <hr />
    <p class="help" id="stats-note" data-i18n="historyHelp"></p>
    <div id="stats"></div>

    <hr />
    <p class="help" data-i18n="benchHelp"></p>
    <div class="field" style="margin-top: 12px">
      <label for="bench-url" data-i18n="benchUrl"></label>
      <input id="bench-url" type="url" placeholder="https://youtu.be/…" />
    </div>
    <div class="field">
      <label data-i18n="benchModels"></label>
      <div id="bench-models" class="checks"></div>
    </div>
    <div class="side-by-side">
      <div class="field">
        <label for="bench-repeat" data-i18n="benchRepeat"></label>
        <input id="bench-repeat" type="number" min="1" max="5" value="1" />
      </div>
    </div>
    <div class="row">
      <button id="bench-start" data-i18n="benchStart"></button>
      <span id="bench-status" class="status"></span>
    </div>
    <div id="bench-result"></div>

    <hr />
    <div class="field">
      <label for="blocklist" data-i18n="blocklist"></label>
      <textarea id="blocklist" rows="8"></textarea>
    </div>
    <div class="field">
      <label for="seen" data-i18n="seen"></label>
      <textarea id="seen" rows="6" readonly></textarea>
      <div class="row" style="margin-top: 8px">
        <span id="seen-count" class="help" style="border: 0; padding: 0"></span>
        <button id="clear" data-i18n="forgetAll"></button>
      </div>
    </div>

    <div class="row" style="margin: 24px 0 8px">
      <button id="save" class="primary" data-i18n="save"></button>
      <span id="status" class="status"></span>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
