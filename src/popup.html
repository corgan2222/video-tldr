<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>video-tldr</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font: 13px sans-serif;
        margin: 0;
        padding: 10px 12px;
        width: 400px;
        background: Canvas;
        color: CanvasText;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      .tagline {
        font-size: 11px;
        opacity: 0.6;
        margin: 0 0 6px;
      }
      a {
        color: LinkText;
        cursor: pointer;
      }
      #video {
        font-weight: bold;
        margin: 6px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 4px 12px;
      }
      button.icon {
        padding: 4px 8px;
      }
      label.check {
        font-weight: normal;
        white-space: nowrap;
      }
      .note {
        opacity: 0.75;
        font-size: 12px;
        margin: 4px 0;
      }
      #lights span {
        margin-right: 10px;
        cursor: help;
      }
      .light::before {
        content: '●';
        margin-right: 4px;
      }
      .light.ok::before {
        color: #188038;
      }
      .light.bad::before {
        color: #d93025;
      }
      .light.unknown::before {
        color: #9aa0a6;
      }
      .job {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      }
      .job h2 {
        font-size: 13px;
        margin: 0 0 4px;
      }
      .steps {
        list-style: none;
        margin: 4px 0;
        padding: 0;
        font-size: 12px;
      }
      .steps li {
        display: flex;
        justify-content: space-between;
        padding: 1px 0;
      }
      .steps .pending {
        opacity: 0.55;
      }
      .steps .running {
        font-weight: bold;
      }
      .steps .failed {
        color: #d93025;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: color-mix(in srgb, CanvasText 15%, transparent);
        overflow: hidden;
        margin: 6px 0 2px;
      }
      .bar > div {
        height: 100%;
        background: #1a73e8;
        transition: width 0.4s linear;
      }
      .error {
        color: #d93025;
        white-space: pre-wrap;
      }
      pre {
        font: 11px monospace;
        max-height: 160px;
        overflow: auto;
        margin: 4px 0 0;
        padding: 4px;
        background: color-mix(in srgb, CanvasText 6%, transparent);
        white-space: pre-wrap;
        word-break: break-all;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        font-weight: bold;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 4px;
      }
      th,
      td {
        text-align: left;
        padding: 1px 10px 1px 0;
      }
      td.n {
        text-align: right;
      }
      #no-service {
        border: 1px solid #d93025;
        border-radius: 4px;
        padding: 6px 8px;
        margin: 8px 0;
      }
      code {
        font-family: monospace;
        background: color-mix(in srgb, CanvasText 10%, transparent);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>video-tldr</h1>
      <a id="settings" data-i18n="settings"></a>
    </header>
    <p class="tagline" data-i18n="tagline"></p>
    <div id="lights" class="note">
      <span
        id="light-service"
        class="light unknown"
        data-i18n="lightService"
      ></span>
      <span id="light-llm" class="light unknown" data-i18n="lightLlm"></span>
      <span id="light-stt" class="light unknown" data-i18n="lightStt"></span>
    </div>

    <div id="no-service" hidden>
      <div><strong data-i18n="noService"></strong></div>
      <div class="note" data-i18n="noServiceHelp"></div>
      <div class="row">
        <code id="start-command"></code>
        <button id="copy-command" data-i18n="copyCommand"></button>
      </div>
    </div>

    <div id="video">…</div>
    <div class="row">
      <button id="fast" disabled data-i18n="fast"></button>
      <button id="thorough" disabled data-i18n="thorough"></button>
      <label class="check" data-i18n-title="timestampsHelp">
        <input type="checkbox" id="timestamps" checked />
        <span data-i18n="timestamps"></span>
      </label>
      <label class="check" data-i18n-title="condensedHelp">
        <input type="checkbox" id="condensed" />
        <span data-i18n="condensed"></span>
      </label>
      <label class="check" data-i18n-title="cleanupHelp">
        <input type="checkbox" id="cleanup" />
        <span data-i18n="cleanup"></span>
      </label>
    </div>
    <div class="row" style="margin-top: 6px">
      <label class="check">
        <span data-i18n="language"></span>
        <select id="language"></select>
      </label>
      <label class="check" data-i18n-title="styleHelp">
        <span data-i18n="style"></span>
        <select id="style"></select>
      </label>
    </div>
    <p class="note" data-i18n="profileHelp"></p>

    <div id="jobs"></div>

    <details id="stats-box">
      <summary data-i18n="statsHeading"></summary>
      <div id="stats"></div>
    </details>
    <details id="log-box">
      <summary data-i18n="serviceLog"></summary>
      <pre id="log"></pre>
    </details>
    <p id="status" class="note"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
