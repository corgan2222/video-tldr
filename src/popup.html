<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>video-tldr</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 420px;
        padding: 12px;
      }
      /* Two lines at most, then an ellipsis: a YouTube title is long. */
      #video {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.35;
        margin: 0 0 var(--gap);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .lights.compact {
        display: flex;
        gap: var(--gap-l);
        margin-bottom: var(--gap);
      }
      .lights.compact .light .what {
        font-weight: 400;
        color: var(--muted);
      }
      .job {
        border-top: 1px solid var(--line);
        padding-top: var(--gap);
        margin-top: var(--gap);
      }
      .job h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .facts {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: var(--gap);
        overflow-wrap: anywhere;
      }
      .steps {
        list-style: none;
        margin: 0 0 var(--gap);
        padding: 0;
        font-size: 12px;
      }
      .steps li {
        display: flex;
        justify-content: space-between;
        gap: var(--gap);
        padding: 2px 0;
      }
      .steps .mark {
        flex: none;
        width: 1em;
        display: inline-block;
      }
      .steps .secs {
        flex: none;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .steps .pending {
        color: var(--muted);
      }
      .steps .running {
        font-weight: 600;
      }
      .steps .failed .mark,
      .steps .failed {
        color: var(--bad);
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--sunken);
        overflow: hidden;
        margin-bottom: 4px;
      }
      .bar > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.4s linear;
      }
      .files {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .files div {
        overflow-wrap: anywhere;
      }
      .error {
        color: var(--bad);
        font-size: 12px;
        margin-bottom: var(--gap);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/48.png" alt="" />
      <div>
        <h1>video-tldr</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <span class="spacer"></span>
      <a id="settings" data-i18n="settings"></a>
    </div>

    <ul class="lights compact">
      <li id="light-service" class="light unknown"></li>
      <li id="light-llm" class="light unknown"></li>
      <li id="light-stt" class="light unknown"></li>
    </ul>

    <div id="no-service" class="box bad" hidden>
      <strong data-i18n="noService"></strong>
      <p class="help" data-i18n="noServiceHelp"></p>
      <div class="row" style="margin-top: 8px">
        <code id="start-command"></code>
        <button id="copy-command" data-i18n="copyCommand"></button>
      </div>
    </div>

    <p id="video">…</p>

    <div class="row">
      <button id="fast" class="primary" disabled data-i18n="fast"></button>
      <button id="thorough" disabled data-i18n="thorough"></button>
    </div>
    <div class="checks" style="margin-top: 10px">
      <label data-i18n-title="timestampsHelp">
        <input type="checkbox" id="timestamps" checked />
        <span data-i18n="timestamps"></span>
      </label>
      <label data-i18n-title="condensedHelp">
        <input type="checkbox" id="condensed" />
        <span data-i18n="condensed"></span>
      </label>
      <label data-i18n-title="cleanupHelp">
        <input type="checkbox" id="cleanup" />
        <span data-i18n="cleanup"></span>
      </label>
    </div>
    <div class="row" style="margin-top: 10px">
      <label class="check">
        <span data-i18n="language"></span>
        <select id="language"></select>
      </label>
      <label class="check" data-i18n-title="styleHelp">
        <span data-i18n="style"></span>
        <select id="style"></select>
      </label>
    </div>
    <p class="help" data-i18n="profileHelp"></p>

    <div id="jobs"></div>

    <details id="stats-box">
      <summary data-i18n="history"></summary>
      <div id="stats"></div>
    </details>
    <details id="log-box">
      <summary data-i18n="serviceLog"></summary>
      <pre id="log"></pre>
    </details>
    <p id="status" class="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
