# Hooks so that what leaves this machine has already been checked.
#
# Two stages, split by what they cost:
#
#   commit  the cheap and the dangerous -- secrets, binaries, broken YAML,
#           formatting. Seconds.
#   push    the slow gate -- the linter and the test suite. Not something to
#           run on every save.
#
# Install both, once per clone:
#
#   pre-commit install --install-hooks
#   pre-commit install --hook-type pre-push
#
# These hooks run on the developer's machine and can be skipped with
# `--no-verify`. That is why ci.yml runs the same checks again on every pull
# request: the hook is the fast feedback, CI is the one that decides.

minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
# Every hook on the commit stage carries `fail_fast: true`. The run has to stop
# at the first failure, or it reaches bump-version at the bottom of this file
# even when a formatter has already said no, and raises the version for a commit
# that cannot happen. A new commit-stage hook needs the key as well; nothing
# fails when it is forgotten.
#
# Per hook, not the top-level key of the same name: that one would govern the
# push stage too, where a failing typecheck would hide what vitest, ruff check
# and pytest have to say. A push is the run worth seeing in full.
#
# The price is on the commit stage. end-of-file-fixer and trailing-whitespace
# repair the file and report failure while doing it, so a file that needs both
# takes two commit attempts. Every extra attempt is another chance to lose
# unstaged changes: pre-commit stashes them for the run and a failed restore
# leaves them nowhere.

repos:
  # ---------------------------------------------------------------- secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: no credentials in the staged change
        stages: [pre-commit]
        fail_fast: true

  # ------------------------------------------------------ the usual suspects
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
        fail_fast: true
      - id: check-added-large-files
        # Raise this deliberately when the repository legitimately needs a
        # bigger file, not because a build artefact slipped in.
        args: ['--maxkb=1024']
        # mermaid.min.js ships with the service on purpose, licence next to it.
        exclude: '^service/src/video_tldr_service/assets/'
        stages: [pre-commit]
        fail_fast: true
      - id: check-merge-conflict
        stages: [pre-commit]
        fail_fast: true
      - id: check-yaml
        # The workflows and the drafter config: a typo here is invisible until
        # a release does not happen.
        stages: [pre-commit]
        fail_fast: true
      - id: check-toml
        stages: [pre-commit]
        fail_fast: true
      - id: end-of-file-fixer
        # Add an exclude: pattern here for recorded test fixtures that must
        # stay byte for byte as they were captured; the shipped minified
        # script is one of those.
        exclude: '(?i)\.(png|ico|jpg|gif)$|^service/src/video_tldr_service/assets/'
        stages: [pre-commit]
        fail_fast: true
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown; keep them.
        args: ['--markdown-linebreak-ext=md']
        exclude: '(?i)\.(png|ico|jpg|gif)$|^service/src/video_tldr_service/assets/'
        stages: [pre-commit]
        fail_fast: true

  - repo: local
    hooks:
      # ------------------------------------------------- main is read-only
      # If main is protected on the server as well, this hook adds nothing to
      # that -- it only fails a second earlier and says what to do instead,
      # rather than letting the push travel to GitHub to be rejected there.
      - id: no-push-to-main
        name: main only ever moves through a pull request
        language: system
        entry: >-
          bash -c 'test "$PRE_COMMIT_REMOTE_BRANCH" != "refs/heads/main" ||
          { echo "main takes merges, not pushes. Branch it:";
          echo "    git switch -c feature/<name>   (or fix/, docs/, test/, chore/)";
          echo "    git push -u origin HEAD && gh pr create";
          exit 1; }'
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      # ------------------------------------------------------- TypeScript
      # Only the staged files, not the tree: that keeps the hook to a second,
      # and the whole tree is what ci.yml checks anyway.
      - id: prettier
        name: prettier --check
        language: system
        entry: npx prettier --check
        types_or: [ts, tsx, json, yaml, markdown, css, html]
        stages: [pre-commit]
        fail_fast: true

      # `files` rather than a type filter: a dependency bump touches
      # package.json and no source file at all, and that is exactly the change
      # worth checking before it leaves. A push that touches none of these
      # skips both hooks, which is the point -- editing the README should not
      # cost a minute.
      - id: typecheck
        name: tsc --noEmit
        language: system
        entry: npm run typecheck
        files: '(\.tsx?$|(^|/)package(-lock)?\.json$|^tsconfig\.json$)'
        pass_filenames: false
        stages: [pre-push]

      - id: vitest
        name: vitest run
        language: system
        entry: npm test
        files: '(\.tsx?$|(^|/)package(-lock)?\.json$|^tsconfig\.json$)'
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      # ------------------------------------------------- Python, service/
      # Through uv, so the hook uses the service's own ruff and pytest. The
      # paths are explicit: a bare `.` would pull every Python file on the
      # machine's checkout into the check, not just the project's.
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: uv run --project service ruff format --check service scripts
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
        fail_fast: true

      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run --project service ruff check service scripts
        files: '(\.py$|^service/pyproject\.toml$|^service/uv\.lock$)'
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        language: system
        entry: uv run --project service pytest service
        files: '(\.py$|^service/pyproject\.toml$|^service/uv\.lock$)'
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      # ---------------------------------------------- version tracks the commit
      # Last in this file on purpose, and it has to stay last. pre-commit runs
      # hooks in file order, the bump adds one to the patch number on every
      # run, and the hook stages its own change -- so a formatter that fails
      # after it leaves the raised number staged in a commit that never
      # happened, and the next attempt raises it again. The `fail_fast: true`
      # on every hook above only spares the bump while the bump comes last.
      # Move this entry up and the version starts jumping by more than one.
      #
      # The staging (scripts/bump_version.py --stage) is also what keeps the
      # commit from failing on the hook's own change: pre-commit decides
      # "files were modified" by diffing the unstaged tree before and after a
      # hook runs, and staging keeps that diff empty.
      - id: bump-version
        name: bump the patch version until the first release tag
        language: system
        entry: python scripts/bump_version.py
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
