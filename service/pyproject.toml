[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corganshelper-service"
# The number lives in src/corganshelper_service/__init__.py, mirrored from
# package.json by scripts/bump_version.py. Not here: uv.lock records the
# project's own version, and a bump in this file would date the lock.
dynamic = ["version"]
description = "The local service behind the corganshelper extension: fetches, transcribes and summarises YouTube videos."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Stefan Knaak", email = "stefan@knaak.org" }]
dependencies = [
    "anthropic>=1.4.0",
    "faster-whisper>=1.2.1",
    "markdown>=3.10.3",
    "numpy>=2.5.3",
    "onnx-asr[hub]>=0.12.0",
    "openai>=3.11.0",
    "python-docx>=1.2.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
corganshelper = "corganshelper_service.__main__:main"

# One of the two extras is needed to transcribe: they carry the ONNX
# runtime for parakeet and, in gpu, the CUDA libraries whisper needs too.
[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9",
    "onnxruntime-gpu[cuda,cudnn]<1.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
# faster-whisper asks for the CPU onnxruntime for its VAD. Installed next
# to onnxruntime-gpu the two packages overwrite each other's files, so the
# runtime comes from the cpu or the gpu extra and from nowhere else.
override-dependencies = ["onnxruntime ; python_version < '3'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.hatch.version]
path = "src/corganshelper_service/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/corganshelper_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
