name: Release

# Runs when the draft that release-drafter.yml keeps is published. It builds
# from the commit the tag points at, not from main, refuses when the tag and
# package.json disagree, and attaches the packed extension to the release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Uploading the asset is the one write this workflow does.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The version lives in package.json; the tag is a label for it. A tag
      # that names another number would ship a build under the wrong name,
      # so the run stops here instead.
      - name: The tag must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag is $TAG, package.json says $version."
            echo "Bump package.json (scripts/bump_version.py --set), merge, then publish."
            exit 1
          fi

      - run: npm run build

      # One zip per store; the manifest differs, the code does not. See
      # scripts/package.py for which key belongs to which store.
      - name: Pack one per store
        run: python scripts/package.py

      # The linter sees what Mozilla gets, not the shared build directory:
      # dist/ carries both background forms and always warns about the half
      # Firefox ignores.
      - name: Lint the Firefox package
        run: |
          mkdir -p .lint
          unzip -q packages/*-firefox.zip -d .lint
          npx web-ext lint --source-dir .lint

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build the service wheel
        run: uv build --project service --wheel --out-dir .

      # What install.ps1 needs besides the wheel. The overrides keep
      # faster-whisper from pulling the CPU onnxruntime in next to the GPU
      # one; they live in pyproject.toml, which uv reads only inside the
      # project, so the release carries them as a file. The constraints
      # pin the combination uv.lock was resolved with, so an install a
      # month from now is the one that was tested. Both exports keep their
      # platform markers, which is why Linux may write them.
      - name: Write the overrides and the constraints
        run: |
          python - <<'PY' > overrides.txt
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("service/pyproject.toml").read_text(encoding="utf-8"))
          print("\n".join(data["tool"]["uv"]["override-dependencies"]))
          PY
          for extra in gpu cpu; do
            uv export --project service --extra "$extra" \
              --no-hashes --no-dev --no-emit-project \
              -o "constraints-$extra.txt"
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            packages/*-firefox.zip packages/*-chrome.zip packages/*-edge.zip \
            *.whl overrides.txt constraints-gpu.txt constraints-cpu.txt
