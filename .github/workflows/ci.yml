name: CI

# Every pull request and every push to main. main only ever moves through a
# pull request, so the second trigger is the merge itself.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch supersedes the first: nobody waits on the
# verdict for a commit that no longer exists. Runs on main are never cancelled,
# because that verdict is the one the release is built on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The same scan .pre-commit-config.yaml runs before a commit. It is here as
  # well because a hook lives on a developer's machine and `--no-verify` skips
  # it; this one nobody can skip. Seconds, so it runs beside the check job
  # rather than after it.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the tip: a key that was committed and
          # removed again is still a key that leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          # --redact so a finding names the file and the rule but never prints
          # the secret into a log that outlives it.
          ./gitleaks git --no-banner --redact --verbose .

  # Does anything the checkers care about actually differ? A change to the
  # README would otherwise cost the full check run; ten seconds here answer
  # the question instead.
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tests/**'
              - '.github/workflows/ci.yml'
              # Anything the build inlines or ships as an asset is source code
              # too, even when its extension says otherwise. Without its entry
              # here a change to such a file would report "nothing here to
              # check" and ship untested. List those files explicitly:
              # - 'src/assets/**'

  check:
    runs-on: ubuntu-latest
    needs: changes

    # The job itself always runs, and the expensive steps are what carry the
    # condition. A job skipped by `if:` reports no status at all, and `check`
    # is a required check on main -- a pull request would sit blocked forever
    # waiting for a verdict that never comes.
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.typescript == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.typescript == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: needs.changes.outputs.typescript == 'true'
        # npm ci, not npm install: the lock file is the contract, and a CI run
        # that quietly rewrites it checks something nobody committed.
        run: npm ci

      - name: Formatting
        if: needs.changes.outputs.typescript == 'true'
        run: npx prettier --check .

      - name: Typecheck
        if: needs.changes.outputs.typescript == 'true'
        run: npm run typecheck

      - name: Tests
        if: needs.changes.outputs.typescript == 'true'
        run: npm test

      - name: Nothing to check
        if: needs.changes.outputs.typescript != 'true'
        run: echo "No TypeScript, manifest or lock file changed -- nothing here to check."
