name: Docs

# The documentation site is built from website/ and published to GitHub
# Pages.
#
# Separate from ci.yml because it has nothing to do with the program: it
# needs Node, it needs none of the project's own toolchain, and a failing
# docs build must not read as a failing build of the project itself.
on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - website/**
      - .github/workflows/docs.yml
  # So the site can be published once without waiting for a change to it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request: does it build at all? `next build` runs the
  # type check too, so a broken component or a bad MDX import fails here
  # rather than after the deploy. This job needs no write access and holds
  # none.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      # The whole history, because each page prints the date of its last
      # commit (website/src/lib/source.ts). A shallow clone knows one
      # commit, which would date every page to the deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile names and fails when the two disagree, so a build here can
      # never quietly use a different version than the one committed.
      - run: npm ci

      # biome, not prettier: the site formats itself, see website/biome.json.
      - run: npm run lint

      - run: npm run build

      # The artefact is only worth uploading from main; on a pull request the
      # build above is the whole point.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  # Publishing happens only from main, and only this job may write.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
