name: Extension

# Builds the packed extension and runs the same linter a Firefox add-on
# reviewer runs before publishing an update. Every pull request and every
# push to main; release.yml builds the one that ships.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compiles src/*.ts and copies manifest, popup and icons beside the
      # output, so dist/ is the directory a browser loads.
      - run: npm run build

      # web-ext is Mozilla's own linter. It checks the manifest against the
      # WebExtensions schema both browsers share, so a Chrome-only mistake
      # (a key Firefox does not know, for example) surfaces here too.
      - name: Lint the packed extension
        run: npx web-ext lint --source-dir dist

      - name: Zip the extension
        run: cd dist && zip -r ../video-tldr.zip .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: video-tldr
          path: video-tldr.zip
