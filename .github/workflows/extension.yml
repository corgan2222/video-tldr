name: Extension

# Builds the packed extension and runs the same linter a Firefox add-on
# reviewer runs before publishing an update. Every pull request and every
# push to main; release.yml builds the one that ships.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compiles src/*.ts and copies manifest, popup and icons beside the
      # output, so dist/ is the directory a browser loads.
      - run: npm run build

      # One zip per store, each with the manifest that store reads: Firefox
      # keeps background.scripts and the gecko block, Chromium keeps the
      # service worker.
      - name: Pack one per store
        run: python scripts/package.py

      # web-ext is Mozilla's own linter, and what it should see is the file
      # Mozilla gets, not the shared build directory: dist/ carries both
      # background forms at once and always draws a warning for the half
      # Firefox ignores. The Firefox package alone must lint clean.
      - name: Lint the Firefox package
        run: |
          mkdir -p .lint
          unzip -q packages/*-firefox.zip -d .lint
          npx web-ext lint --source-dir .lint

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-tldr
          path: packages/*.zip
