# Release Drafter keeps the next release's notes up to date as pull requests
# are merged, so that publishing becomes a decision rather than an evening
# spent reading the log.
#
# How this fits the workflows beside it:
#
#   release-drafter.yml  rewrites the draft on every push to main
#   autolabeler.yml      labels a pull request from its branch, title and files
#
# Branch prefixes this project uses: feature/ fix/ docs/ test/ chore/.
# bugfix/ is accepted as a synonym for fix/ below, for a branch created
# before this schema was settled on.
#
# The version below is a suggestion, not a decision. Keep the project manifest
# (package.json, mirrored into src/manifest.json) as the single source of
# truth, and let the release workflow refuse to build when the tag and the
# manifest disagree. A wrong guess here then cannot ship a mislabelled
# artifact; it fails loudly instead. Bump the manifest first, then publish the
# draft.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# `exclusive: true` on every changelog category, and the order below is the
# priority: a pull request lands in the first heading it matches and in no
# other. Without it one pull request appears under every label it carries --
# measured on a pull request that honestly earned `ci`, `documentation` and
# `chore` at once and would have been listed three times.
#
# The order answers "what was this change actually about?". A feature that also
# touches the README is a feature; a CI change that also touches the README is
# a CI change; only a pull request that is nothing else is documentation.
# Maintenance sits last as the catch-all.
categories:
  - title: '🚀 Features'
    exclusive: true
    semver-increment: minor
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    exclusive: true
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '🧪 Tests'
    exclusive: true
    when:
      labels:
        - 'test'
  - title: '⚙️ Build, CI and Dependencies'
    exclusive: true
    when:
      labels:
        - 'ci'
        - 'build'
        - 'dependencies'
  - title: '📖 Documentation'
    exclusive: true
    when:
      labels:
        - 'documentation'
  - title: '🧰 Maintenance'
    exclusive: true
    when:
      labels:
        - 'chore'
        - 'refactor'

  # Anything wearing this label stays out of the notes entirely.
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  # A feature moves the minor digit through the category above. These two say
  # what the other labels do to the suggested number; patch is the default, so
  # an unlabelled pull request never proposes a bigger jump than it earned.
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      label: 'major'
  - type: 'version-resolver'
    semver-increment: 'patch'

change-template: '- $TITLE (#$NUMBER) $AUTHORS'

# Escapes the characters that would otherwise let a pull request title reach
# into the release notes as markup.
change-title-escapes: '\<*_&'

no-changes-template: '- Nothing that reaches a user.'

# Matchers are evaluated independently: one match is enough for the label.
# The branch patterns follow this project's naming -- feature/*, fix/*,
# docs/*, test/*, chore/* -- so an ordinary branch labels itself and the notes
# are sorted without anyone remembering to do it. bugfix/* labels the same as
# fix/*, for a branch created before this schema was settled on.
autolabeler:
  - label: 'feature'
    branch:
      - '/feature\/.+/'
  - label: 'fix'
    branch:
      - '/fix\/.+/'
      - '/bugfix\/.+/'
    title:
      - '/^fix/i'
  - label: 'test'
    branch:
      - '/test\/.+/'
  - label: 'documentation'
    branch:
      - '/docs?\/.+/'
    files:
      - '*.md'
      - 'docs/**'
  - label: 'ci'
    files:
      - '.github/**'
      - '.pre-commit-config.yaml'
  - label: 'dependencies'
    files:
      - 'package.json'
      - 'package-lock.json'
      - 'website/package.json'
      - 'website/package-lock.json'
  - label: 'chore'
    branch:
      - '/chore\/.+/'

# release.yml attaches one package per store and the service wheel; the
# lines below tell a reader which file is for what. Keep the names in step
# with scripts/package.py, which writes them.
template: |
  ## Changes

  $CHANGES

  The extension ships as one zip per store, each with the manifest that
  store reads. The code in all three is the same.

  | File | For |
  | --- | --- |
  | `video-tldr-$RESOLVED_VERSION-firefox.zip` | Firefox, and a manual install through `about:debugging` |
  | `video-tldr-$RESOLVED_VERSION-chrome.zip` | Chrome, Brave, Opera, Vivaldi |
  | `video-tldr-$RESOLVED_VERSION-edge.zip` | Edge |

  The store listings are the supported way to install it.

  The service is the `.whl`, and `install.ps1` in the repository fetches
  it along with `overrides.txt` and the `constraints-*.txt` that pin the
  combination this release was resolved with:

  ```
  irm https://raw.githubusercontent.com/$OWNER/$REPOSITORY/main/install.ps1 | iex
  ```

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
